---
os: linux
dist: jammy
language: python
python:
  - '3.12'
before_install:
  - pip install --upgrade pip setuptools
branches:
  only:
    - main
    - CD
jobs:
  include:
    - name: Check YAML format
      install:
        - pip install yamllint
      script:
        - yamllint .
    - name: test docker
      services:
        - docker
      script:
        - docker compose up -d --build
        - sleep 5
        - docker compose exec -T nginx-proxy head -1 /etc/nginx/conf.d/default.conf | grep '^# nginx-proxy'
        - docker compose exec -T nginx-proxy nginx -t
